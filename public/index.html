    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }

  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

e=\"color:#17201C;font-weight:600\">Fri 8:12 pm<\u002Fb><\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;gap:12px\"><span>Checked by<\u002Fspan><b style=\"color:#17201C;font-weight:600\">Your desk · Ana<\u002Fb><\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;gap:12px\"><span>Damage found<\u002Fspan><b style=\"color:#17201C;font-weight:600\">None<\u002Fb><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- PROMISE -->\n<div style=\"border-top:1px solid #E3E6E1\">\n<div class=\"wrap\" style=\"padding-top:40px;padding-bottom:40px;text-align:center\">\n<p style=\"font-size:24px;line-height:34px;font-weight:700;letter-spacing:-.01em;color:#085041;max-width:820px;margin:0 auto\">“Your next guest should know they made the right choice within 10 seconds of walking in.”<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- PROBLEMS -->\n<div class=\"night\">\n<div class=\"wrap sec\" style=\"padding-top:96px;padding-bottom:96px;display:flex;flex-direction:column;gap:40px\">\n<div style=\"display:flex;flex-direction:column;gap:12px;max-width:720px\">\n<div class=\"label\">The problem<\u002Fdiv>\n<h2 class=\"h2\">Turnovers go wrong when you're not there to see them.<\u002Fh2>\n<\u002Fdiv>\n<div class=\"grid\" style=\"grid-template-columns:repeat(auto-fit,minmax(260px,1fr))\">\n<div style=\"border:1px solid #3C4641;border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:10px\"><span class=\"chip chip-fail\" style=\"align-self:flex-start\">No-show<\u002Fspan><h3 style=\"font-size:20px;line-height:28px;font-weight:700\">The cleaner doesn't show<\u002Fh3><p style=\"font-size:15px;line-height:24px;color:#C5CCC7\">You find out at noon, with a guest arriving at 3.<\u002Fp><\u002Fdiv>\n<div style=\"border:1px solid #3C4641;border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:10px\"><span class=\"chip chip-fixed\" style=\"align-self:flex-start\">Missed<\u002Fspan><h3 style=\"font-size:20px;line-height:28px;font-weight:700\">The guest finds the problem<\u002Fh3><p style=\"font-size:15px;line-height:24px;color:#C5CCC7\">Hair in the shower, missing towels, a stain on the sofa. Then it's in the review.<\u002Fp><\u002Fdiv>\n<div style=\"border:1px solid #3C4641;border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:10px\"><span class=\"chip\" style=\"align-self:flex-start\">No proof<\u002Fspan><h3 style=\"font-size:20px;line-height:28px;font-weight:700\">The damage claim gets denied<\u002Fh3><p style=\"font-size:15px;line-height:24px;color:#C5CCC7\">Without timestamped before-and-after photos, it's your word against the guest's.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- HOW IT WORKS -->\n<div id=\"how\">\n<div class=\"wrap sec\" style=\"padding-top:96px;padding-bottom:96px;display:flex;flex-direction:column;gap:40px\">\n<div style=\"display:flex;flex-direction:column;gap:12px;max-width:720px\">\n<div class=\"label\">How it works<\u002Fdiv>\n<h2 class=\"h2\">You approve the standard once. We run every turn against it.<\u002Fh2>\n<\u002Fdiv>\n<div class=\"grid\" style=\"grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px\">\n<div style=\"background:#F6F7F5;border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:10px\"><div style=\"width:40px;height:40px;border-radius:9999px;background:#0F6E56;color:#FFFFFF;font-weight:800;display:flex;align-items:center;justify-content:center\">1<\u002Fdiv><h3 style=\"font-size:18px;line-height:26px;font-weight:700\">We confirm the night before<\u002Fh3><p style=\"font-size:15px;line-height:24px;color:#4A5550\">Your cleaner gets a text. No reply by our cutoff? We line up your backup.<\u002Fp><\u002Fdiv>\n<div style=\"background:#F6F7F5;border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:10px\"><div style=\"width:40px;height:40px;border-radius:9999px;background:#0F6E56;color:#FFFFFF;font-weight:800;display:flex;align-items:center;justify-content:center\">2<\u002Fdiv><h3 style=\"font-size:18px;line-height:26px;font-weight:700\">Photos on arrival<\u002Fh3><p style=\"font-size:15px;line-height:24px;color:#4A5550\">Before touching anything, the cleaner photographs how the guest left it. That's your evidence.<\u002Fp><\u002Fdiv>\n<div style=\"background:#F6F7F5;border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:10px\"><div style=\"width:40px;height:40px;border-radius:9999px;background:#0F6E56;color:#FFFFFF;font-weight:800;display:flex;align-items:center;justify-content:center\">3<\u002Fdiv><h3 style=\"font-size:18px;line-height:26px;font-weight:700\">Clean to your Turn Standard<\u002Fh3><p style=\"font-size:15px;line-height:24px;color:#4A5550\">A phone link with example photos for every angle, plus two close-up spot checks that change daily.<\u002Fp><\u002Fdiv>\n<div style=\"background:#F6F7F5;border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:10px\"><div style=\"width:40px;height:40px;border-radius:9999px;background:#0F6E56;color:#FFFFFF;font-weight:800;display:flex;align-items:center;justify-content:center\">4<\u002Fdiv><h3 style=\"font-size:18px;line-height:26px;font-weight:700\">We check and fix<\u002Fh3><p style=\"font-size:15px;line-height:24px;color:#4A5550\">A person compares every photo to your approved examples. Anything off goes back to the cleaner before check-in.<\u002Fp><\u002Fdiv>\n<div style=\"background:#F6F7F5;border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:10px\"><div style=\"width:40px;height:40px;border-radius:9999px;background:#0F6E56;color:#FFFFFF;font-weight:800;display:flex;align-items:center;justify-content:center\">5<\u002Fdiv><h3 style=\"font-size:18px;line-height:26px;font-weight:700\">You get one report<\u002Fh3><p style=\"font-size:15px;line-height:24px;color:#4A5550\">\"Ready\", or what we found and what we did. Damage? The claim packet is already put together.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"card\" style=\"padding:24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px\">\n<div style=\"display:flex;flex-direction:column;gap:10px\"><div class=\"label\">Every turn includes<\u002Fdiv><p style=\"font-size:15px;line-height:24px;color:#4A5550\">Fresh linens and made beds, bathrooms and kitchen surfaces cleaned, floors done, trash out, supplies checked and counted, thermostat and lights reset.<\u002Fp><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:10px\"><div class=\"label\" style=\"color:#5F6A65\">Scheduled separately<\u002Fdiv><p style=\"font-size:15px;line-height:24px;color:#4A5550\">Deep cleans, inside the oven and fridge, windows, and repairs. We flag them in your report so nothing is forgotten.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- EVIDENCE -->\n<div id=\"evidence\" class=\"wrap sec\" style=\"padding-top:96px;padding-bottom:96px;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:56px;align-items:center\">\n<div style=\"display:flex;flex-direction:column;gap:16px\">\n<div class=\"label\">The evidence<\u002Fdiv>\n<h2 class=\"h2\">Before and after, same angle, every time.<\u002Fh2>\n<p class=\"lead\">Arrival photos show how the guest left it. After photos show how your next guest finds it. When something's broken or stained, we put the timestamped pair, the booking dates and a short write-up into one packet you can send to Airbnb or Vrbo.<\u002Fp>\n<div style=\"display:flex;flex-direction:column;gap:12px;margin-top:8px\">\n<div style=\"display:flex;gap:12px;font-size:16px;line-height:26px;color:#17201C\"><svg class=\"check\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0F6E56\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12l5 5L20 7\"><\u002Fpath><\u002Fsvg>Timestamped photos from every turn<\u002Fdiv>\n<div style=\"display:flex;gap:12px;font-size:16px;line-height:26px;color:#17201C\"><svg class=\"check\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0F6E56\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12l5 5L20 7\"><\u002Fpath><\u002Fsvg>Damage-claim packet prepared for you<\u002Fdiv>\n<div style=\"display:flex;gap:12px;font-size:16px;line-height:26px;color:#17201C\"><svg class=\"check\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0F6E56\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12l5 5L20 7\"><\u002Fpath><\u002Fsvg>Low supplies flagged before they run out<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"card\" style=\"padding:24px;display:flex;flex-direction:column;gap:16px\">\n<div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px\"><div class=\"label\" style=\"color:#5F6A65\">Unit 4 · Tue 13 Oct<\u002Fdiv><span class=\"chip chip-fail\">Damage found<\u002Fspan><\u002Fdiv>\n<h3 style=\"font-size:20px;line-height:28px;font-weight:700\">Sofa cushion stained, living room<\u002Fh3>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px\">\n<div><div class=\"photo\"><img src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAgFBgcGBQgHBgcJCAgJDBMMDAsLDBgREg4THBgdHRsYGxofIywlHyEqIRobJjQnKi4vMTIxHiU2OjYwOiwwMTD/2wBDAQgJCQwKDBcMDBcwIBsgMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDD/wgARCAI4AvgDASIAAhEBAxEB/8QAGwAAAwEBAQEBAAAAAAAAAAAAAAECAwQFBgf/xAAXAQEBAQEAAAAAAAAAAAAAAAAAAQID/9oADAMBAAIQAxAAAAH7GLnDDTB5xu8drz04+/m05+h1FnTw3Z28PdboYxLs+Hpk5fK9nyGzl6eaa00y1KaoGmNpjAlYAwATRz/mH6n+Wbz+ka/NXL9GvnEfSL5qT6c+Vk+sXyUn1y+Qk+yPjJPtD4mT7c+Gk+6Xwkn3p8Aj78/P5P0M/OZP0f5HxFZ9X9N4H0ONUxygADQJghggAAAENDEAAAACAj1NctuvPjnXHGX05aXjkdU6Pfk3uq87XnjuSyW8ujFN98uiby8X2/Gbzx2zWNsNpbqaGDBgMBWJwNAAE/CfeRZ8A/uzU+Gf3BHxD+3S/FP7QPjK+xD49/Xh8k/rCPlb+nF+Zv6MPna+gDwL9wPEr2SPIr1Q8vT0AjQcAwAABKAAACAAQ0AADEDQAAIYejty9XXljh18WJvrz7uOy5urRc2t3WJrjLl05dFPeLajom2l4H0Hi or:#17201C;font-weight:600\">Oct 10–13 · 3 nights<\u002Fb><\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;gap:12px\"><span>Claim packet<\u002Fspan><b style=\"color:#0F6E56;font-weight:700\">Ready to send<\u002Fb><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font-size:11px;line-height:16px;color:#5F6A65;font-style:italic\">Sample photos for illustration.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- PHILIPPINES TEAM -->\n<div style=\"background:#E7F2EC\">\n<div class=\"wrap sec\" style=\"padding-top:96px;padding-bottom:96px;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:56px;align-items:center\">\n<div style=\"display:flex;flex-direction:column;gap:16px\">\n<div class=\"label\" style=\"color:#085041\">Our team<\u002Fdiv>\n<h2 class=\"h2\" style=\"color:#0B2E22\">Awake while you sleep.<\u002Fh2>\n<p style=\"font-size:18px;line-height:29px;color:#24453A\">We're a small operations team based in the Philippines. Your evening in the US is our morning, which is exactly when tomorrow's cleaners need confirming. Turnover-day reviews run on our night shift, so a real person is watching while it happens.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:12px\">\n<div style=\"background:#FFFFFF;border-radius:14px;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap\"><span style=\"font-size:15px;color:#4A5550\">Your evening, the night before<\u002Fspan><span style=\"font-size:15px;font-weight:700;color:#17201C\">Cleaner confirmed<\u002Fspan><\u002Fdiv>\n<div style=\"background:#FFFFFF;border-radius:14px;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap\"><span style=\"font-size:15px;color:#4A5550\">Checkout, as the cleaner arrives<\u002Fspan><span style=\"font-size:15px;font-weight:700;color:#17201C\">Arrival photos logged<\u002Fspan><\u002Fdiv>\n<div style=\"background:#FFFFFF;border-radius:14px;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap\"><span style=\"font-size:15px;color:#4A5550\">As the cleaner finishes<\u002Fspan><span style=\"font-size:15px;font-weight:700;color:#17201C\">Photos checked, fixes made<\u002Fspan><\u002Fdiv>\n<div style=\"background:#FFFFFF;border-radius:14px;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap\"><span style=\"font-size:15px;color:#4A5550\">Before check-in<\u002Fspan><span style=\"font-size:15px;font-weight:700;color:#17201C\">Report in your inbox<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- COMPARE -->\n<div id=\"compare\" class=\"wrap sec\" style=\"padding-top:96px;padding-bottom:48px;display:flex;flex-direction:column;gap:28px\">\n<div style=\"display:flex;flex-direction:column;gap:12px;max-width:720px\">\n<div class=\"label\">How we compare<\u002Fdiv>\n<h2 class=\"h2\">Keep your tools. We run the turnover.<\u002Fh2>\n<p class=\"lead\">Apps give you a checklist and a place for photos. Someone still has to chase the cleaner, check the photos and fix what's wrong. That's us.<\u002Fp>\n<\u002Fdiv>\n<div style=\"overflow-x:auto;border:1px solid #DDE2DC;border-radius:16px;background:#FFFFFF\">\n<sc-raw-table class=\"tbl\" style=\"width:100%;min-width:780px;border-collapse:collapse;font-size:15px;line-height:22px\">\n<sc-raw-thead><sc-raw-tr style=\"background:#17201C;color:#F4F6F3\">\n<sc-raw-th style=\"font-weight:700\">What happens<\u002Fsc-raw-th>\n<sc-raw-th style=\"font-weight:700\">Scheduling apps<br><span style=\"font-weight:500;color:#9AA59F\">Turno, Breezeway<\u002Fspan><\u002Fsc-raw-th>\n<sc-raw-th style=\"font-weight:700\">Checklist apps<br><span style=\"font-weight:500;color:#9AA59F\">Veloa<\u002Fspan><\u002Fsc-raw-th>\n<sc-raw-th style=\"font-weight:700\">Photo inspection<br><span style=\"font-weight:500;color:#9AA59F\">Properly<\u002Fspan><\u002Fsc-raw-th>\n<sc-raw-th style=\"font-weight:8 F6A65\">Based on each company's public website and materials, October 2026. Features change; check current offers. Already use one of these? Keep it. We work on top of it.<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- PRICING -->\n<div id=\"pricing\" class=\"wrap sec\" style=\"padding-top:48px;padding-bottom:96px;display:flex;flex-direction:column;gap:40px\">\n<div style=\"display:flex;flex-direction:column;gap:12px;max-width:720px\">\n<div class=\"label\">Pricing<\u002Fdiv>\n<h2 class=\"h2\">One price per property. A person included.<\u002Fh2>\n<p class=\"lead\">Less than one bad review, one no-show or one denied damage claim.<\u002Fp>\n<\u002Fdiv>\n<div class=\"grid\" style=\"grid-template-columns:repeat(auto-fit,minmax(300px,1fr))\">\n<div class=\"card\" style=\"padding:32px;display:flex;flex-direction:column;gap:20px;border:2px solid #0F6E56;position:relative\">\n<span class=\"chip chip-pass\" style=\"align-self:flex-start\">Founding hosts · first 10 only<\u002Fspan>\n<div style=\"display:flex;align-items:baseline;gap:8px;flex-wrap:wrap\"><span style=\"font-size:48px;line-height:52px;font-weight:800;letter-spacing:-.02em\">$49<\u002Fspan><span style=\"font-size:16px;color:#5F6A65\">per property / month<\u002Fspan><\u002Fdiv>\n<p style=\"font-size:15px;line-height:24px;color:#4A5550\">Locked for your first 6 months after the free pilot. Everything in Standard.<\u002Fp>\n<a class=\"btn btn-primary\" href=\"#pilot\" style=\"text-align:center\">Start the free pilot<\u002Fa>\n<\u002Fdiv>\n<div class=\"card\" style=\"padding:32px;display:flex;flex-direction:column;gap:20px\">\n<span class=\"chip\" style=\"align-self:flex-start\">Standard<\u002Fspan>\n<div style=\"display:flex;align-items:baseline;gap:8px;flex-wrap:wrap\"><span style=\"font-size:48px;line-height:52px;font-weight:800;letter-spacing:-.02em\">$79<\u002Fspan><span style=\"font-size:16px;color:#5F6A65\">per property / month<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:10px;font-size:15px;line-height:24px;color:#17201C\">\n<div style=\"display:flex;gap:10px\"><svg class=\"check\" width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0F6E56\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12l5 5L20 7\"><\u002Fpath><\u002Fsvg>Up to 12 turnovers a month, then $7 each<\u002Fdiv>\n<div style=\"display:flex;gap:10px\"><svg class=\"check\" width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0F6E56\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12l5 5L20 7\"><\u002Fpath><\u002Fsvg>Night-before confirmation and backup cleaner<\u002Fdiv>\n<div style=\"display:flex;gap:10px\"><svg class=\"check\" width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0F6E56\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12l5 5L20 7\"><\u002Fpath><\u002Fsvg>Every photo checked, fixes before check-in<\u002Fdiv>\n<div style=\"display:flex;gap:10px\"><svg class=\"check\" width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0F6E56\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12l5 5L20 7\"><\u002Fpath><\u002Fsvg>Report after every turn, damage-claim packets<\u002Fdiv>\n<div style=\"display:flex;gap:10px\"><svg class=\"check\" width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0F6E56\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12l5 5L20 7\"><\u002Fpath><\u002Fsvg>Turn Standard and example photos set up for you<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font-size:13px;line-height:20px;color:#5F6A65\">Minimum 2 properties or $99 a month. Billed monthly in advance; cancel anytime before your next month.<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- FAQ -->\n<div id=\"faq\" style=\"background:#F6F7F5\">\n<div class=\"sec\" style=\"max-width:820px;margin:0 auto;padding:96px 24px;display:flex;flex-direction:column;gap:12px\">\n<div class=\"label\">FAQ<\u002Fdiv>\n<h2 class=\"h2\" style=\"margin-bottom:16px\">Questions hosts ask<\u002Fh2>\n<details class=\"card\" style=\"padding:18px 22px;box-shadow:none\"><summary style=\"display:flex;justify-content:space-between;gap:16px;font-size:17px;line-height:26px;font-weight:600;cursor:pointer\">Do my cleaners need to download an app?<span class=\"plus\" style=\"color:#0F6E56;font-size:22px;transition:transform .2s\">+<\u002Fspan><\u002Fsummary><p style=\"margin-top:10px;font-size:16px;line-height:26px;color:#4A5550\">No. They get a text with a link for each job and open it on their phone. About 18 photos, guided by examples.<\u002Fp><\u002Fdetails>\n<details class=\"card\" style=\"padding:18px 22px;box-shadow:none\"><summary style=\"display:flex;justify-content:space-between;gap:16px;font-size:17px;line-height:26px;font-weight:600;cursor:pointer\">You've never seen my property. How do you know what \"clean\" looks like?<span class=\"plus\" style=\"color:#0F6E56;font-size:22px;transition:transform .2s\">+<\u002Fspan><\u002Fsummary><p style=\"margin-top:10px;font-size:16px;line-height:26px;color:#4A5550\">On the first turn, your cleaner photographs the finished unit. You approve or correct those photos, and they become your Turn Standard. Every turn after is checked against what you approved.<\u002Fp><\u002Fdetails>\n<details class=\"card\" style=\"padding:18px 22px;box-shadow:none\"><summary style=\"display:flex;justify-content:space-between;gap:16px;font-size:17px;line-height:26px;font-weight:600;cursor:pointer\">What if my cleaner doesn't confirm?<span class=\"plus\" style=\"color:#0F6E56;font-size:22px;transition:transform .2s\">+<\u002Fspan><\u002Fsummary><p style=\"margin-top:10px;font-size:16px;line-height:26px;color:#4A5550\">We contact your backup cleaner and send them the same checklist. You hear from us only if neither is available.<\u002Fp><\u002Fdetails>\n<details class=\"card\" style=\"padding:18px 22px;box-shadow:none\"><summary style=\"display:flex;justify-content:space-between;gap:16px;font-size:17px;line-height:26px;font-weight:600;cursor:pointer\">I already use Turno or Breezeway. Do I switch?<span class=\"plus\" style=\"color:#0F6E56;font-size:22px;transition:transform .2s\">+<\u002Fspan><\u002Fsummary><p style=\"margin-top:10px;font-size:16px;line-height:26px;color:#4A5550\">No. Keep scheduling and paying cleaners the way you do. We work on top of it.<\u002Fp><\u002Fdetails>\n<details class=\"card\" style=\"padding:18px 22px;box-shadow:none\"><summary style=\"display:flex;justify-content:space-between;gap:16px;font-size:17px;line-height:26px;font-weight:600;cursor:pointer\">Do you restock supplies?<span class=\"plus\" style=\"color:#0F6E56;font-size:22px;transition:transform .2s\">+<\u002Fspan><\u002Fsummary><p style=\"margin-top:10px;font-size:16px;line-height:26px;color:#4A5550\">Your cleaner counts supplies on every turn and we flag anything running low in your report, so you can reorder in time. We don't buy supplies for you.<\u002Fp><\u002Fdetails>\n<details class=\"card\" style=\"padding:18px 22px;box-shadow:none\"><summary style=\"display:flex;justify-content:space-between;gap:16px;font-size:17px;line-height:26px;font-weight:600;cursor:pointer\">Who sees my photos, and how long do you keep them?<span class=\"plus\" style=\"color:#0F6E56;font-size:22px;transition:transform .2s\">+<\u002Fspan><\u002Fsummary><p style=\"margin-top:10px;font-size:16px;line-height:26px;color:#4A5550\">Only you, your cleaner and our team. Reference photos stay as long as you're with us, photos from any issue for 1 year, and routine turn photos for 90 days.<\u002Fp><\u002Fdetails>\n<details class=\"card\" style=\"padding:18px 22px;box-shadow:none\"><summary style=\"display:flex;justify-content:space-between;gap:16px;font-size:17px;line-height:26px;font-weight:600;cursor:pointer\">What happens after the free pilot?<span class=\"plus\" style=\"color:#0F6E56;font-size:22px;transition:transform .2s\">+<\u002Fspan><\u002Fsummary><p style=\"margin-top:10px;font-size:16px;line-height:26px;color:#4A5550\">If you want to continue, we send your first monthly invoice. Pay it and we keep going. If not, nothing to cancel.<\u002Fp><\u002Fdetails>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- PILOT CTA -->\n<div id=\"pilot\" class=\"wrap sec\" style=\"padding-top:96px;padding-bottom:96px\">\n<div style=\"background:#0F6E56;border-radius:24px;padding:56px 40px;color:#FFFFFF;display:flex;flex-direction:column;align-items:center;text-align:center;gap:20px\">\n<svg width=\"56\" height=\"56\" sc-camel-view-box=\"0 0 64 64\" aria-hidden=\"true\"><circle cx=\"32\" cy=\"32\" r=\"32\" fill=\"#FFFFFF\"><\u002Fcircle><path d=\"M44.2 17.4A19 19 0 1 1 22.6 15.6\" fill=\"none\" stroke=\"#0F6E56\" stroke-width=\"5\" stroke-linecap=\"round\"><\u002Fpath><path d=\"M28.6 12.1 L17.4 10.6 L23.6 22.2 Z\" fill=\"#0F6E56\"><\u002Fpath><path d=\"M23.5 33 L29.5 39 L41 27\" fill=\"none\" stroke=\"#0F6E56\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n<h2 class=\"h2\" style=\"max-width:720px\">Try it on one property for two weeks. Free.<\u002Fh2>\n<p style=\"font-size:18px;line-height:29px;color:#D8F0E6;max-width:600px\">A 20-minute call to set up your Turn Standard and cleaner contacts. Keep your cleaner, keep your tools, keep your routine.<\u002Fp>\n<a class=\"btn\" href=\"[YOUR BOOKING LINK]\" style=\"font-size:16px;padding:16px 28px;background:#FFFFFF;border-color:#FFFFFF;color:#085041\">Book a setup call<\u002Fa>\n<div style=\"font-size:14px;color:#D8F0E6\">No card needed for the pilot.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"border-top:1px solid #E3E6E1\">\n<div class=\"wrap\" style=\"padding-top:24px;padding-bottom:24px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;font-size:14px;line-height:22px;color:#5F6A65\">\n<span><b style=\"color:#17201C;font-weight:700\">Turnover Desk<\u002Fb> · Your turnover desk.<\u002Fspan>\n<span>[hello@yourdomain.com] · [US phone number]<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:6560}}\">\nclass Component extends DCLogic {\nrenderVals() { return {}; }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
